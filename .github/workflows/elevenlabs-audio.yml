name: Generate ElevenLabs B2 Audio

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elevenlabs-b2-audio
  cancel-in-progress: false

jobs:
  generate-and-publish:
    name: Generate expressive MP3s and publish
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the listening exam
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Check configured ElevenLabs secret
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::Add ELEVENLABS_API_KEY in Settings > Secrets and variables > Actions before running."
            exit 1
          fi
          echo "ElevenLabs credential present"

      - name: Produce five expressive B2 recordings
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 generate_elevenlabs.py

      - name: Verify all audio recordings
        run: |
          for n in 1 2 3 4 5; do
            test -s "audio/group-$n.mp3"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "audio/group-$n.mp3"
          done

      - name: Credit the actual voice provider
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          content=path.read_text()
          content=content.replace('Synthetic narration, not ElevenLabs', 'Narration generated with ElevenLabs')
          path.write_text(content)
          PY

      - name: Publish generated files to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/group-1.mp3 audio/group-2.mp3 audio/group-3.mp3 audio/group-4.mp3 audio/group-5.mp3 index.html
          if git diff --cached --quiet; then
            echo "Audio files unchanged"
          else
            git commit -m "Publish B2 First listening recordings generated by ElevenLabs"
            git push origin HEAD:main
          fi
